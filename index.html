<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Network Topology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; outline: none !important; box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0c;
      background-image: url('./assets/stage-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    canvas { display: block; outline: none !important; }
    body { font-family: "GFS Didot", Didot, "Bodoni MT", serif; color: #e8f4ff; }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      padding: 24px 32px;
      pointer-events: none;
    }
    #hud.hidden { opacity: 0; pointer-events: none; }
    #hud.in-lobby .hud-center,
    #hud.in-lobby .hud-right {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .hud-left {
      justify-self: start;
    }
    .logo-stack {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .logo-stack::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 38%;
      width: 78%;
      height: 70%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(51, 230, 255, 0.5), transparent 62%),
        radial-gradient(ellipse at 35% 55%, rgba(180, 70, 255, 0.32), transparent 58%),
        radial-gradient(ellipse at 68% 48%, rgba(57, 255, 157, 0.28), transparent 55%);
      filter: blur(14px);
      z-index: -1;
      animation: logoBacklight 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    #logo {
      display: block;
      width: 108px;
      height: auto;
      user-select: none;
      position: relative;
      filter:
        drop-shadow(0 0 6px rgba(51, 230, 255, 0.95))
        drop-shadow(0 0 16px rgba(180, 80, 255, 0.55))
        drop-shadow(0 0 28px rgba(57, 255, 157, 0.32));
      animation: logoGlow 3.6s ease-in-out infinite;
    }
    .wordmark {
      font-family: "GFS Didot", Didot, "Bodoni MT", serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
      color: rgba(244, 251, 255, 0.94);
      white-space: nowrap;
    }
    @keyframes logoGlow {
      0%, 100% {
        filter:
          drop-shadow(0 0 5px rgba(51, 230, 255, 0.7))
          drop-shadow(0 0 14px rgba(180, 80, 255, 0.4))
          drop-shadow(0 0 22px rgba(57, 255, 157, 0.22));
      }
      50% {
        filter:
          drop-shadow(0 0 9px rgba(51, 230, 255, 1))
          drop-shadow(0 0 22px rgba(180, 80, 255, 0.7))
          drop-shadow(0 0 36px rgba(57, 255, 157, 0.42));
      }
    }
    @keyframes logoBacklight {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.96); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }
    .hud-center {
      justify-self: center;
      padding-top: 10px;
    }
    .hud-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      padding-top: 6px;
    }

    #round-label {
      font-family: "GFS Didot", Didot, serif;
      font-size: clamp(22px, 2.6vw, 32px);
      font-weight: 400;
      letter-spacing: 0.14em;
      color: rgba(244, 251, 255, 0.92);
    }

    .btn {
      cursor: pointer;
      border: 1px solid rgba(120, 230, 255, 0.22);
      background: rgba(8, 14, 24, 0.45);
      color: #d7f6ff;
      font-family: "GFS Didot", Didot, "Bodoni MT", serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 9px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }
    .btn:hover { border-color: rgba(120, 230, 255, 0.55); }
    .btn.ghost { background: transparent; }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: stretch;
      justify-content: center;
      padding: 48px 32px;
      background: rgba(5, 6, 10, 0.72);
      backdrop-filter: blur(16px);
    }
    .screen.open { display: flex; }

    .panel {
      width: min(920px, 100%);
      margin: auto;
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }
    .panel-head h1 {
      font-family: "GFS Didot", Didot, serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 400;
      letter-spacing: 0.04em;
    }
    .panel-head p {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(180, 230, 255, 0.5);
    }

    #leaderboard-screen .lb-table-wrap {
      flex: 1;
      overflow: auto;
      border-top: 1px solid rgba(120, 230, 255, 0.12);
    }
    #leaderboard-screen table { width: 100%; border-collapse: collapse; }
    #leaderboard-screen th,
    #leaderboard-screen td { padding: 14px 8px; text-align: left; }
    #leaderboard-screen th {
      position: sticky;
      top: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(180, 230, 255, 0.45);
      background: rgba(5, 6, 10, 0.92);
    }
    #leaderboard-screen td {
      font-size: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    #leaderboard-screen tbody tr:nth-child(1) td { color: #fff6d6; }
    #leaderboard-screen tbody tr:nth-child(2) td { color: #e8f4ff; }
    #leaderboard-screen tbody tr:nth-child(3) td { color: #d7ffe8; }
    #leaderboard-screen .num {
      font-family: "GFS Didot", Didot, serif;
      font-size: 18px;
      width: 64px;
    }
    #leaderboard-screen .score { text-align: right; }
    #leaderboard-screen th.score { text-align: right; }
    #leaderboard-screen .rank {
      width: 56px;
      color: rgba(180, 230, 255, 0.4);
      font-size: 12px;
      letter-spacing: 0.16em;
    }
    #leaderboard-screen .lb-empty-row td {
      color: rgba(180, 230, 255, 0.42);
      letter-spacing: 0.08em;
    }

    #leaderboard {
      position: fixed;
      left: 32px;
      bottom: 32px;
      z-index: 20;
      width: min(292px, calc(100vw - 168px));
      padding: 16px 18px 12px;
      border: 1px solid rgba(120, 230, 255, 0.16);
      border-radius: 18px;
      background: rgba(6, 8, 14, 0.58);
      backdrop-filter: blur(18px);
      pointer-events: none;
    }
    #leaderboard.hidden,
    #leaderboard.in-lobby { opacity: 0; }
    .lb-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(120, 230, 255, 0.12);
    }
    .lb-head h2 {
      font-family: "GFS Didot", Didot, serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }
    .lb-kicker {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(180, 230, 255, 0.5);
    }
    #lb-body {
      list-style: none;
      display: flex;
      flex-direction: column;
    }
    .lb-row {
      display: grid;
      grid-template-columns: 28px 36px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-row:nth-child(1) { color: #fff6d6; }
    .lb-row:nth-child(2) { color: #e8f4ff; }
    .lb-row:nth-child(3) { color: #d7ffe8; }
    .lb-empty {
      padding: 10px 0 6px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: rgba(180, 230, 255, 0.42);
    }
    .rank {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: rgba(180, 230, 255, 0.42);
    }
    .num {
      font-family: "GFS Didot", Didot, serif;
      font-size: 18px;
      letter-spacing: 0.02em;
    }
    .lb-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      color: inherit;
    }
    .score {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      font-size: 14px;
      text-align: right;
    }

    #clue-screen {
      padding: 36px 56px 48px;
    }
    #clue-screen .panel {
      width: min(1080px, 100%);
      height: 100%;
      max-height: none;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0;
    }
    #clue-screen .panel-head {
      margin-bottom: 0;
    }
    #clue-title {
      font-family: "GFS Didot", Didot, serif;
      font-size: clamp(36px, 6vw, 72px);
      font-weight: 400;
      align-self: center;
      justify-self: center;
      text-align: center;
      line-height: 1.15;
    }
    .clue-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 2vh;
      text-align: center;
    }
    #clue-text {
      max-width: 640px;
      font-size: 18px;
      line-height: 1.7;
      color: rgba(220, 240, 255, 0.72);
    }
    #clue-media:empty { display: none; }
    #clue-media img {
      max-height: min(28vh, 280px);
      max-width: min(70vw, 640px);
      border-radius: 12px;
    }
    #clue-media audio { width: min(480px, 70vw); }
    #clue-media figcaption {
      margin-top: 10px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(180, 230, 255, 0.45);
    }

    .dock-btn {
      position: fixed;
      right: 32px;
      bottom: 32px;
      z-index: 25;
      pointer-events: auto;
    }
    .dock-btn.hidden {
      display: none;
    }
    #demo-screen {
      padding: 0;
      background: rgba(5, 6, 10, 0.88);
    }
    #demo-screen .panel {
      width: min(1280px, 100%);
      height: 100%;
      max-height: none;
      margin: 0 auto;
      padding: 28px 32px 36px;
    }
    #demo-screen video {
      width: 100%;
      max-height: calc(100vh - 140px);
      background: #000;
      border-radius: 12px;
    }
    #demo-fallback {
      display: none;
      margin-top: 16px;
      font-size: 16px;
      color: rgba(220, 240, 255, 0.7);
    }
    #demo-fallback.show { display: block; }

    @media (max-width: 720px) {
      #hud { padding: 12px 14px; }
      #logo { width: 88px; }
      .wordmark { font-size: 12px; }
      .hud-right { gap: 6px; padding-top: 2px; }
      .hud-center { padding-top: 4px; }
      .btn { padding: 8px 10px; letter-spacing: 0.1em; }
      #leaderboard {
        left: 14px;
        bottom: 14px;
        width: min(240px, calc(100vw - 108px));
        padding: 12px 12px 8px;
      }
      .dock-btn { right: 14px; bottom: 14px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/",
      "socket.io-client": "https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <header id="hud" class="in-lobby">
    <div class="hud-left">
      <div class="logo-stack">
        <img id="logo" src="./assets/logo-mark.png" alt="" />
        <span class="wordmark">&lt;Coding Club&gt;</span>
      </div>
    </div>
    <div class="hud-center">
      <h2 id="round-label">Round 0</h2>
    </div>
    <div class="hud-right">
      <button id="clue-btn" class="btn" type="button">Play clue</button>
    </div>
  </header>

  <aside id="leaderboard" class="in-lobby" aria-label="Top 5 nodes">
    <div class="lb-head">
      <h2>Top 5</h2>
      <span class="lb-kicker">Nodes</span>
    </div>
    <ol id="lb-body"></ol>
  </aside>

  <section id="clue-screen" class="screen" aria-hidden="true">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h1 id="clue-round">Round 0</h1>
          <p>Clue</p>
        </div>
        <button id="clue-back" class="btn ghost" type="button">Back</button>
      </div>
      <h2 id="clue-title"></h2>
      <div class="clue-bottom">
        <figure id="clue-media"></figure>
        <p id="clue-text"></p>
      </div>
    </div>
  </section>

  <button id="demo-btn" class="btn dock-btn" type="button">Play demo</button>
  <button id="lb-btn" class="btn dock-btn hidden" type="button">Leaderboard</button>

  <section id="leaderboard-screen" class="screen" aria-hidden="true">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h1>Leaderboard</h1>
          <p>Live cluster standings</p>
        </div>
        <button id="lb-back" class="btn ghost" type="button">Back</button>
      </div>
      <div class="lb-table-wrap">
        <table>
          <thead>
            <tr>
              <th class="rank">Rank</th>
              <th class="num">No.</th>
              <th>Cluster</th>
              <th class="score">Score</th>
            </tr>
          </thead>
          <tbody id="lb-full-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="demo-screen" class="screen" aria-hidden="true">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h1>Demo</h1>
          <p>Pre-show</p>
        </div>
        <button id="demo-back" class="btn ghost" type="button">Back</button>
      </div>
      <video id="demo-video" controls playsinline preload="metadata" src="./assets/demo.mp4"></video>
      <p id="demo-fallback">Drop the demo file at <code>assets/demo.mp4</code> and refresh.</p>
    </div>
  </section>

  <script type="module" src="./index.js"></script>
  <script type="module" src="./engine-bridge.js"></script>
</body>
</html>
